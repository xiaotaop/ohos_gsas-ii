name: Repository verification

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show environment
        run: |
          python --version
          git --version
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

      - name: Check Python syntax
        run: python -m compileall -q scripts poc

      - name: Validate JSON files
        run: python scripts/Validate-JsonFiles.py

      - name: Validate core API contracts
        run: python scripts/Validate-CoreContracts.py

      - name: Verify fixture integrity
        run: python scripts/Verify-Fixtures.py
