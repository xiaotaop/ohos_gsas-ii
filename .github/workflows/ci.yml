name: Repository verification

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Show environment
        run: |
          python --version
          node --version
          git --version
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

      - name: Check Python syntax
        run: python -m compileall -q scripts poc bridge

      - name: Validate JSON files
        run: python scripts/Validate-JsonFiles.py

      - name: Validate core API contracts
        run: python scripts/Validate-CoreContracts.py

      - name: Verify fixture integrity
        run: python scripts/Verify-Fixtures.py

      - name: Test Python bridge
        run: python -m unittest -v bridge.tests.test_python_bridge

      - name: Test runtime assembly and HAP auditing
        run: python -m unittest discover -s tests -p 'test_release_tools.py' -v

      - name: Test runtime manifest generation
        run: python -m unittest discover -s tests -p 'test_runtime_manifest_tool.py' -v

      - name: Test GSAS-II native extension payload gate
        run: python -m unittest discover -s tests -p 'test_payload_native_check.py' -v

      - name: Test native runtime staging, normalization and HAP SBOM
        run: |
          python -m unittest discover -s tests -p 'test_native_runtime_layout.py' -v
          python -m unittest discover -s tests -p 'test_python_needed.py' -v
          python -m unittest discover -s tests -p 'test_hap_sbom.py' -v
          python -m unittest discover -s tests -p 'test_source_companion.py' -v
          python -m unittest discover -s tests -p 'test_third_party_review.py' -v
          python -m unittest discover -s tests -p 'test_stage_third_party_licenses.py' -v
          python -m unittest discover -s tests -p 'test_prune_runtime_orphans.py' -v
          python -m unittest discover -s tests -p 'test_scientific_runtime_audit.py' -v
          python -m unittest discover -s tests -p 'test_finalize_hap_sbom.py' -v
          python -m unittest discover -s tests -p 'test_final_review_snapshot.py' -v

      - name: Test native exclusive file creation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/file-exporter-native.test.cpp -o /tmp/gsas-exclusive-test
          /tmp/gsas-exclusive-test

      - name: Test core service orchestration (C++ port of bridge/service.py)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            tests/core-service-native.test.cpp app/entry/src/main/cpp/core/core_service.cpp \
            -o /tmp/gsas-core-service-test
          /tmp/gsas-core-service-test

      - name: Test embedded CPython initialization across native threads
        run: |
          mkdir -p /tmp/gsas-py-thread/rt/lib
          python - <<'PYSETUP'
          import pathlib, sys, sysconfig
          root = pathlib.Path('/tmp/gsas-py-thread/rt')
          (root / 'lib' / f'python{sys.version_info.major}.{sys.version_info.minor}').symlink_to(sysconfig.get_path('stdlib'))
          (root / 'bridge').symlink_to(pathlib.Path('bridge').resolve())
          PYSETUP
          c++ -std=c++17 -Wall -Wextra -Werror -Wno-deprecated-declarations -DGSAS_HAS_PYTHON -pthread \
            -I app/entry/src/main/cpp $(python3-config --includes) \
            tests/python-host-thread-smoke.cpp app/entry/src/main/cpp/python/python_host.cpp \
            app/entry/src/main/cpp/core/core_service.cpp $(python3-config --embed --ldflags) \
            -o /tmp/gsas-python-thread-test
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          GSAS_SMOKE_ROOT=/tmp/gsas-py-thread timeout 30 /tmp/gsas-python-thread-test

      - name: Test file service on host filesystem
        run: |
          npm install --prefix /tmp/gsas-file-tests --no-package-lock --no-save typescript@5.4.5
          GSAS_TYPESCRIPT_PATH=/tmp/gsas-file-tests/node_modules/typescript node --test tests/file-service-host.test.cjs
          GSAS_TYPESCRIPT_PATH=/tmp/gsas-file-tests/node_modules/typescript node --test tests/input-selection.test.cjs
          GSAS_TYPESCRIPT_PATH=/tmp/gsas-file-tests/node_modules/typescript node --test tests/parameter-drafts.test.cjs
          GSAS_TYPESCRIPT_PATH=/tmp/gsas-file-tests/node_modules/typescript node --test tests/runtime-installer-host.test.cjs
          GSAS_TYPESCRIPT_PATH=/tmp/gsas-file-tests/node_modules/typescript node --test tests/core-bridge-host.test.cjs

      - name: Test ArkUI mock model
        run: |
          npx --yes --package typescript@5.4.5 tsc ui-mock/entry/src/main/ets/model/Refinement.ts --target ES2020 --module commonjs --strict --skipLibCheck --outDir ui-mock/build/test-model
          node tests/ui-mock.test.cjs
          GSAS_TYPESCRIPT_PATH=/tmp/gsas-file-tests/node_modules/typescript node --test tests/formal-refinement.test.cjs
          pwsh -NoProfile -File scripts/Sync-UiMockFixtures.ps1 -Check
