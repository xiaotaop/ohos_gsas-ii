[binaries]
c = '/usr/bin/clang-20'
cpp = '/usr/bin/clang++-20'
fortran = '/usr/bin/flang-new-20'
ar = '/usr/bin/llvm-ar-20'
strip = '/usr/bin/llvm-strip-20'
python = '/work/host-venv/bin/python'
cython = '/work/host-venv/bin/cython'

[built-in options]
c_args = ['--target=aarch64-linux-ohos', '--sysroot=/work/sdk/sysroot', '-fPIC', '-O2', '-D__OHOS__']
cpp_args = ['--target=aarch64-linux-ohos', '--sysroot=/work/sdk/sysroot', '-fPIC', '-O2', '-nostdinc++', '-isystem/work/sdk/include/c++/v1']
fortran_args = ['--target=aarch64-linux-ohos', '--sysroot=/work/sdk/sysroot', '-fPIC', '-O2']
c_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/work/sdk/sysroot', '-fuse-ld=lld', '-nostdlib', '-L/work/sdk/lib/aarch64-linux-ohos', '-L/work/runtime-build', '-L/work/decimal-build', '-lFortranRuntime', '-lFortranDecimal', '-lc++_shared', '-lc', '/work/sdk/clang-resource/15.0.4/lib/aarch64-linux-ohos/libclang_rt.builtins.a', '-Wl,--no-undefined']
cpp_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/work/sdk/sysroot', '-fuse-ld=lld', '-nostdlib', '-L/work/sdk/lib/aarch64-linux-ohos', '-lc++_shared', '-lc']

[properties]
needs_exe_wrapper = true
skip_sanity_check = true
numpy-include-dir = '/runtime-input/payload/runtime/lib/python3.12/site-packages/numpy/_core/include'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
